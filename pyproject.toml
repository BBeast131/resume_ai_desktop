[project]
name = "resume-ai-desktop"
version = "1.0.0"
description = "Resume AI: desktop app that collects jobs and generates tailored resumes through ChatGPT."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "qasync>=0.27",
    "httpx>=0.27",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "keyring>=25",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spike", "app/data/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["N802", "N815"]  # Qt overrides are camelCase

[tool.ruff.lint.per-file-ignores]
"app/ui/theme.py" = ["E501"]   # the stylesheet: one rule per line reads better than wrapped rules
"app/ui/icons.py" = ["E501"]   # SVG path data
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/config.py", "app/data", "app/sync", "app/services", "app/automation/prompt.py", "app/automation/chat_url.py", "app/automation/job_rules.py"]
exclude = ["app/data/alembic/"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.ui.*", "app.browser.*"]
ignore_errors = true
