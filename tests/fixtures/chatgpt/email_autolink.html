<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ChatGPT fixture: auto-linked e-mail</title>
<style>a { display: inline-flex; } [data-markdown-copy="exclude"] { display: inline-block; }</style>
</head>
<body>
<!-- ChatGPT turns an e-mail address into a link with an icon span. Read with
     innerText, that once put a newline INSIDE the JSON string and broke it. -->
<main>
  <div data-content-search-unit-key="fallback-turn-0:2:assistant" data-chatgpt-search-unit-key="fallback-turn-0:2:assistant">
    <h4 data-conversation-role="assistant">ChatGPT said:</h4>
    <div data-markdown-text-style="assistant-message"><p><span>{</span><br><span>"email": "</span><a href="mailto:a@b.co"><span>a@b.co</span><span data-markdown-copy="exclude" style="display:inline-block"><svg width="8" height="8"><title>mail</title></svg></span></a><span>",</span><br><span>"n": 1</span><br><span>}</span></p></div>
  </div>
</main>
</body>
</html>
